[server]
# Tamaño máximo (en MB) de cada imagen cargada con st.file_uploader.
maxUploadSize = 200
# Reduce el contenido repetitivo de la interfaz enviado por el WebSocket,
# especialmente útil al abrir la app desde una conexión móvil.
enableWebsocketCompression = true
# WSL en /mnt/c usa sondeo lento; desactivarlo evita escanear .venv y el repo.
fileWatcherType = "none"

[theme]
base = "light"
primaryColor = "#2F5D46"
backgroundColor = "#FBFBF8"
secondaryBackgroundColor = "#F1F3EC"
textColor = "#2C3531"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
